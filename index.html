<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Entre Nós"/>
<meta name="theme-color" content="#0d1117"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>Entre Nós</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --ouro: #c9a84c;
    --ouro-claro: #f0e2b8;
    --ouro-escuro: #8a6e2a;
    --fundo: #0d1117;
    --fundo-card: #141c2e;
    --fundo-card-antigo: #0f1420;
    --borda: #2a3a5a;
    --borda-fraca: #1a2438;
    --texto-muted: #7a8aaa;
    --texto-arquivo: #9aaacf;
    --separador: #5a6a8a;
  }

  html, body {
    background: var(--fundo);
    color: var(--ouro-claro);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    position: relative;
    height: 220px;
    overflow: hidden;
  }

  .header-foto {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 20%;
    filter: brightness(0.38) saturate(0.75);
  }

  .header-gradiente {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(to bottom, transparent, var(--fundo));
  }

  .header-conteudo {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 12px;
  }

  .icone-aliancas { margin-bottom: 12px; opacity: 0.92; }

  .titulo {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 34px;
    font-weight: 400;
    color: #f0e6c8;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 16px rgba(0,0,0,0.9);
  }

  .subtitulo {
    font-size: 12px;
    color: #c8a860;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-top: 6px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }

  .conteudo {
    padding: 0 16px;
    padding-bottom: 120px;
  }

  .tela { display: none; }
  .tela.ativa { display: block; }

  .separador-data {
    font-size: 13px;
    font-weight: 600;
    color: #8a9ec0;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 24px 0 14px;
    padding-left: 2px;
  }

  /* CARD */
  .card-oracao {
    background: var(--fundo-card);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 12px;
    border: 0.5px solid var(--borda);
    transition: transform 0.15s, border-color 0.15s;
  }

  .card-oracao.tocando { border-color: var(--ouro); background: #17213a; }
  .card-oracao.antigo { background: var(--fundo-card-antigo); border-color: var(--borda-fraca); opacity: 0.82; }

  .card-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .card-titulo {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 17px;
    color: var(--ouro-claro);
    line-height: 1.3;
  }

  .card-antigo .card-titulo { color: var(--texto-arquivo); }

  .card-meta {
    font-size: 13px;
    color: var(--texto-muted);
    margin-top: 5px;
  }

  .card-acoes {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .btn-play {
    background: #1e2f50;
    border: none;
    border-radius: 50%;
    width: 42px; height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .card-oracao.tocando .btn-play { background: var(--ouro-escuro); }
  .btn-play svg { width: 16px; height: 16px; fill: var(--ouro); }
  .card-antigo .btn-play { background: #141b2e; }
  .card-antigo .btn-play svg { fill: #5a6a8a; }

  /* BOTÃO COMPARTILHAR */
  .btn-compartilhar {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }

  .btn-compartilhar:active { opacity: 1; }
  .btn-compartilhar svg { width: 18px; height: 18px; fill: none; stroke: var(--ouro); stroke-width: 1.8; }

  .barra-fundo {
    background: #0d1117;
    border-radius: 8px;
    height: 3px;
    overflow: hidden;
    cursor: pointer;
  }

  .barra-progresso {
    height: 100%;
    background: var(--ouro);
    border-radius: 8px;
    width: 0%;
    transition: width 0.5s linear;
  }

  .badge-novo {
    font-size: 10px;
    background: #1a2540;
    color: var(--ouro);
    border: 0.5px solid var(--ouro-escuro);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e2f50;
    color: var(--ouro-claro);
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 20px;
    border: 0.5px solid var(--borda);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 300;
  }

  .toast.visivel {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* PLAYER FIXO */
  .player-fixo {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #111827;
    border-top: 0.5px solid var(--borda);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: none;
    z-index: 100;
  }

  .player-fixo.visivel { display: block; }

  .player-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .player-titulo {
    font-family: Georgia, serif;
    font-size: 15px;
    color: var(--ouro-claro);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-tempo {
    font-size: 12px;
    color: var(--texto-muted);
    font-variant-numeric: tabular-nums;
    min-width: 85px;
    text-align: right;
  }

  .player-controles {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn-player {
    background: none; border: none;
    cursor: pointer; padding: 4px;
    display: flex; align-items: center; justify-content: center;
  }

  .btn-player svg { width: 22px; height: 22px; fill: var(--ouro); }
  .btn-player.secundario svg { fill: var(--texto-muted); width: 18px; height: 18px; }

  .barra-player {
    flex: 1; height: 4px;
    background: #1a2438;
    border-radius: 4px;
    cursor: pointer;
  }

  .barra-player-progresso {
    height: 100%; background: var(--ouro);
    border-radius: 4px; width: 0%;
    pointer-events: none;
  }

  /* NAV */
  .nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--fundo);
    border-top: 0.5px solid var(--borda);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-around;
    z-index: 200;
    transition: transform 0.3s;
  }

  .nav.com-player { transform: translateY(-70px); }

  .nav-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer; opacity: 0.35;
    transition: opacity 0.2s;
    padding: 0 24px;
    background: none; border: none;
  }

  .nav-item.ativo { opacity: 1; }
  .nav-item svg { width: 24px; height: 24px; fill: none; stroke: var(--ouro-claro); stroke-width: 1.5; }
  .nav-item.ativo svg { stroke: var(--ouro); }
  .nav-label { font-size: 11px; color: var(--separador); letter-spacing: 0.08em; }
  .nav-item.ativo .nav-label { color: var(--ouro); }

  /* ARQUIVO */
  .arquivo-mes-titulo {
    font-size: 13px; color: var(--separador);
    letter-spacing: 0.16em; text-transform: uppercase;
    margin: 24px 0 12px;
    border-bottom: 0.5px solid var(--borda-fraca);
    padding-bottom: 10px;
  }

  /* FAMÍLIA */
  .familia-vazio { text-align: center; padding: 60px 20px; }
  .familia-vazio svg { width: 52px; height: 52px; fill: none; stroke: var(--borda); stroke-width: 1; margin-bottom: 20px; }
  .familia-vazio p { font-family: Georgia, serif; font-size: 17px; color: var(--separador); line-height: 1.7; }

  .loading { text-align: center; padding: 48px; font-family: Georgia, serif; font-size: 15px; color: var(--separador); }
  .spinner { width: 22px; height: 22px; border: 1.5px solid var(--borda); border-top-color: var(--ouro); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .estado-vazio { text-align: center; padding: 48px 24px; }
  .estado-vazio svg { width: 44px; height: 44px; fill: none; stroke: var(--borda); stroke-width: 1; margin-bottom: 18px; }
  .estado-vazio p { font-family: Georgia, serif; font-size: 16px; color: var(--separador); line-height: 1.7; }
</style>
</head>
<body>

<div class="header">
  <img class="header-foto" src="foto-casal.jpg" alt="Entre Nós" onerror="this.style.display='none'"/>
  <div class="header-gradiente"></div>
  <div class="header-conteudo">
    <svg class="icone-aliancas" width="48" height="28" viewBox="0 0 48 28" fill="none">
      <rect x="1.5" y="7" width="18" height="14" rx="7" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
      <rect x="28.5" y="7" width="18" height="14" rx="7" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
      <path d="M19.5 14 C21 14 22.5 14 24 14 C25.5 14 27 14 28.5 14" stroke="#c9a84c" stroke-width="1.5"/>
      <circle cx="19.5" cy="14" r="2.2" fill="#c9a84c"/>
      <circle cx="28.5" cy="14" r="2.2" fill="#c9a84c"/>
    </svg>
    <div class="titulo">Entre Nós</div>
    <div class="subtitulo">orações do dia</div>
  </div>
</div>

<div class="conteudo">
  <div id="tela-inicio" class="tela ativa">
    <div id="lista-oracoes"><div class="loading"><div class="spinner"></div>carregando orações...</div></div>
  </div>
  <div id="tela-arquivo" class="tela">
    <div id="lista-arquivo"><div class="loading"><div class="spinner"></div>carregando arquivo...</div></div>
  </div>
  <div id="tela-familia" class="tela">
    <div class="familia-vazio">
      <svg viewBox="0 0 48 48"><circle cx="16" cy="14" r="7"/><circle cx="32" cy="14" r="7"/><path d="M2 40 C2 30 10 24 16 24"/><path d="M46 40 C46 30 38 24 32 24"/><path d="M16 40 C16 32 20 28 24 28 C28 28 32 32 32 40"/></svg>
      <p>Em breve você poderá<br/>convidar os filhos<br/>para rezar juntos.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast">Link copiado!</div>

<div class="player-fixo" id="player-fixo">
  <div class="player-info">
    <div class="player-titulo" id="player-titulo-texto">—</div>
    <div class="player-tempo" id="player-tempo-texto">0:00 / 0:00</div>
  </div>
  <div class="player-controles">
    <button class="btn-player secundario" onclick="anteriorFaixa()" aria-label="Anterior">
      <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="4" x2="5" y2="20" stroke-width="2" stroke="currentColor" fill="none"/></svg>
    </button>
    <button class="btn-player" onclick="togglePlay()" aria-label="Play/Pause">
      <svg id="icone-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <button class="btn-player secundario" onclick="proximaFaixa()" aria-label="Próxima">
      <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="4" x2="19" y2="20" stroke-width="2" stroke="currentColor" fill="none"/></svg>
    </button>
    <div class="barra-player" onclick="buscarPosicao(event)">
      <div class="barra-player-progresso" id="barra-player-progresso"></div>
    </div>
  </div>
</div>

<nav class="nav" id="nav-principal">
  <button class="nav-item ativo" id="nav-inicio" onclick="irPara('inicio')" aria-label="Início">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21V12h6v9"/></svg>
    <span class="nav-label">início</span>
  </button>
  <button class="nav-item" id="nav-arquivo" onclick="irPara('arquivo')" aria-label="Arquivo">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 2v4M16 2v4"/></svg>
    <span class="nav-label">arquivo</span>
  </button>
  <button class="nav-item" id="nav-familia" onclick="irPara('familia')" aria-label="Família">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><circle cx="17" cy="9" r="3"/><path d="M1 21c0-4 3.6-7 8-7s8 3 8 7"/><path d="M17 14c2.5 0 5 1.8 5 5"/></svg>
    <span class="nav-label">família</span>
  </button>
</nav>

<audio id="audio-player" preload="none"></audio>

<script>
const GITHUB_USER = 'cleuberpasilva-boop';
const GITHUB_REPO = 'entre-nos';
const BRANCH = 'main';
const BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}`;
const JSON_URL = `${BASE_URL}/audios.json`;

let oracoes = [];
let indiceAtual = -1;
let tocando = false;
const audio = document.getElementById('audio-player');

function formatarTempo(seg) {
  if (isNaN(seg) || seg < 0) return '0:00';
  const m = Math.floor(seg / 60);
  const s = Math.floor(seg % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function formatarData(str) {
  const [a, m, d] = str.split('-');
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${a}`;
}

function ehHoje(str) {
  const hoje = new Date();
  const [a, m, d] = str.split('-');
  return parseInt(d) === hoje.getDate() && parseInt(m) === (hoje.getMonth()+1) && parseInt(a) === hoje.getFullYear();
}

function ehOntem(str) {
  const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  const [a, m, d] = str.split('-');
  return parseInt(d) === ontem.getDate() && parseInt(m) === (ontem.getMonth()+1) && parseInt(a) === ontem.getFullYear();
}

function labelData(str) {
  if (ehHoje(str)) return 'hoje · ' + formatarData(str);
  if (ehOntem(str)) return 'ontem · ' + formatarData(str);
  return formatarData(str);
}

async function carregarOracoes() {
  try {
    const r = await fetch(JSON_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error();
    oracoes = await r.json();
    oracoes.sort((a, b) => {
      const cmp = b.data.localeCompare(a.data);
      return cmp !== 0 ? cmp : b.horario.localeCompare(a.horario);
    });
    renderizarInicio();
    renderizarArquivo();
  } catch(e) {
    document.getElementById('lista-oracoes').innerHTML = `
      <div class="estado-vazio">
        <svg viewBox="0 0 48 48"><path d="M24 8v20M24 36v2"/><circle cx="24" cy="24" r="20" stroke-width="1.2"/></svg>
        <p>Nenhuma oração ainda.<br/>Grave e suba o primeiro áudio<br/>para começar.</p>
      </div>`;
  }
}

function criarCardHTML(o, idx, antigo) {
  const classeAntigo = antigo ? 'antigo' : '';
  const badgeNovo = ehHoje(o.data) && idx === 0 ? '<span class="badge-novo">nova</span>' : '';
  const duracao = o.duracao ? o.duracao : '—';
  return `
    <div class="card-oracao ${classeAntigo}" id="card-${idx}">
      <div class="card-topo" onclick="tocarOu(${idx})">
        <div>
          <div class="card-titulo">${o.titulo}${badgeNovo}</div>
          <div class="card-meta">${o.horario} · ${duracao}</div>
        </div>
        <div class="card-acoes">
          <button class="btn-compartilhar" onclick="event.stopPropagation(); compartilhar(${idx})" aria-label="Compartilhar">
            <svg viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>
          <button class="btn-play" id="btn-${idx}" aria-label="Tocar ${o.titulo}">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
        </div>
      </div>
      <div class="barra-fundo" onclick="tocarOu(${idx})">
        <div class="barra-progresso" id="prog-${idx}"></div>
      </div>
    </div>`;
}

function renderizarInicio() {
  if (!oracoes.length) return;
  let html = '';
  let dataAtual = null;
  oracoes.forEach((o, i) => {
    if (o.data !== dataAtual) {
      dataAtual = o.data;
      html += `<div class="separador-data">${labelData(o.data)}</div>`;
    }
    html += criarCardHTML(o, i, !ehHoje(o.data));
  });
  document.getElementById('lista-oracoes').innerHTML = html;
}

function renderizarArquivo() {
  if (!oracoes.length) { document.getElementById('lista-arquivo').innerHTML = ''; return; }
  const porMes = {};
  oracoes.forEach((o, i) => {
    const [a, m] = o.data.split('-');
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const chave = `${meses[parseInt(m)-1]} ${a}`;
    if (!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({...o, idx: i});
  });
  let html = '';
  for (const [mes, itens] of Object.entries(porMes)) {
    html += `<div class="arquivo-mes-titulo">${mes}</div>`;
    itens.forEach(o => { html += criarCardHTML(o, o.idx, true); });
  }
  document.getElementById('lista-arquivo').innerHTML = html;
}

// COMPARTILHAR
async function compartilhar(idx) {
  const o = oracoes[idx];
  if (!o) return;
  const linkAudio = `${BASE_URL}/audios/${encodeURIComponent(o.arquivo)}`;
  const texto = `🙏 Uma oração para você\n\n${o.titulo} · ${formatarData(o.data)}\n\n${linkAudio}\n\n— Entre Nós`;

  if (navigator.share) {
    try {
      await navigator.share({ title: `Entre Nós — ${o.titulo}`, text: texto });
    } catch(e) { /* cancelou */ }
  } else {
    try {
      await navigator.clipboard.writeText(texto);
      mostrarToast('Link copiado! 🙏');
    } catch(e) {
      mostrarToast('Copie: ' + linkAudio);
    }
  }
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visivel');
  setTimeout(() => t.classList.remove('visivel'), 2500);
}

function tocarOu(idx) {
  if (indiceAtual === idx && tocando) { pausar(); } else { tocar(idx); }
}

function tocar(idx) {
  const o = oracoes[idx];
  if (!o) return;
  if (indiceAtual >= 0) {
    const ca = document.getElementById(`card-${indiceAtual}`);
    const ba = document.getElementById(`btn-${indiceAtual}`);
    const pa = document.getElementById(`prog-${indiceAtual}`);
    if (ca) ca.classList.remove('tocando');
    if (ba) ba.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
    if (pa) pa.style.width = '0%';
  }
  indiceAtual = idx;
  audio.src = `${BASE_URL}/audios/${encodeURIComponent(o.arquivo)}`;
  audio.play();
  tocando = true;
  const card = document.getElementById(`card-${idx}`);
  const btn = document.getElementById(`btn-${idx}`);
  if (card) card.classList.add('tocando');
  if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';
  document.getElementById('player-titulo-texto').textContent = o.titulo;
  document.getElementById('icone-play').outerHTML = '<svg id="icone-play" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';
  document.getElementById('player-fixo').classList.add('visivel');
  document.getElementById('nav-principal').classList.add('com-player');
}

function pausar() {
  audio.pause(); tocando = false;
  const btn = document.getElementById(`btn-${indiceAtual}`);
  if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
  document.getElementById('icone-play').outerHTML = '<svg id="icone-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
}

function togglePlay() { if (tocando) pausar(); else { audio.play(); tocando = true; } }
function proximaFaixa() { if (indiceAtual < oracoes.length - 1) tocar(indiceAtual + 1); }
function anteriorFaixa() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (indiceAtual > 0) tocar(indiceAtual - 1);
}

function buscarPosicao(e) {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration * 100).toFixed(1) + '%';
  const p = document.getElementById(`prog-${indiceAtual}`);
  if (p) p.style.width = pct;
  document.getElementById('barra-player-progresso').style.width = pct;
  document.getElementById('player-tempo-texto').textContent =
    formatarTempo(audio.currentTime) + ' / ' + formatarTempo(audio.duration);
});

audio.addEventListener('ended', () => {
  tocando = false;
  const btn = document.getElementById(`btn-${indiceAtual}`);
  if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
  document.getElementById('icone-play').outerHTML = '<svg id="icone-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
  if (indiceAtual < oracoes.length - 1) proximaFaixa();
});

function irPara(tela) {
  ['inicio','arquivo','familia'].forEach(t => {
    document.getElementById(`tela-${t}`).classList.toggle('ativa', t === tela);
    document.getElementById(`nav-${t}`).classList.toggle('ativo', t === tela);
  });
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
carregarOracoes();
</script>
